[project]
name = "pelotas-budget-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RafaelsBahr", email = "rafaelsedrezbahr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "pyarrow>=26.0.0",
]

[project.scripts]
pelotas-budget-pipeline = "pelotas_budget_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
]
